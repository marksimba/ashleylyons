<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lost in the woods — Ashley Lyons</title>
  <link rel="icon" href="assets/logo-forest-64.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: "Jost", sans-serif; color: #f4efe6; padding: 2rem;
      background: linear-gradient(160deg, #39506b 0%, #3f5c48 55%, #22382c 100%);
    }
    h1 { font-family: "Cormorant Garamond", serif; font-size: clamp(4rem, 14vw, 8rem); color: #e9c983; line-height: 1; }
    p { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.4rem; margin: 0.5rem 0 2rem; opacity: 0.9; }
    a {
      display: inline-block; background: #d9a441; color: #22382c; text-decoration: none;
      padding: 0.85rem 1.8rem; border-radius: 999px; font-weight: 500; letter-spacing: 0.03em;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    a:hover { background: #e9c983; transform: translateY(-2px); }
    .leaf { font-size: 2.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="leaf">🍃</div>
    <h1>404</h1>
    <p>This path grew over. Let's walk back.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
